<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>JOYEUX ANNIVERSAIRE RUTH — Showreel Motion 18s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETTE
   ============================================================ */
:root{
  --cream:#EADFCF;
  --cream2:#F3ECE0;
  --ink:#141110;
  --ink2:#241D18;
  --brown:#7C4A2A;
  --orange:#D9985A;
  --orange2:#EBAE68;
  --green:#1C7A46;
  --lip:#9E0F2C;
  --white:#F5F1EA;
  --bgr:234,223,207;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#080706;overflow:hidden;overscroll-behavior:none}
body{
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}

/* ============================================================
   STAGE  (format mobile 9:16)
   ============================================================ */
#stage{
  position:relative;
  width:min(100vw,56.25vh); height:min(100vh,177.78vw);
  width:min(100vw,56.25dvh); height:min(100dvh,177.78vw);
  container-type:size;
  overflow:hidden;background:var(--ink);
  box-shadow:0 2cqw 12cqw rgba(0,0,0,.85);
  cursor:pointer;
}
#art{position:absolute;inset:0;width:100%;height:100%;display:block}
#type{position:absolute;inset:0;pointer-events:none}
.sc{position:absolute;inset:0;opacity:0;pointer-events:none;will-change:transform,opacity}
.ln{display:block;white-space:nowrap;overflow:hidden;
    padding:.28em .5em .32em;margin:-.28em -.5em -.32em}
.ln .ch{display:inline-block;overflow:hidden;vertical-align:top;
        padding:.28em 0 .32em;margin:-.28em 0 -.32em}
.ln .ch i{display:block;font-style:normal}
.disc{display:block;overflow:hidden;padding:.1em 0 .16em}
.disc i{display:block;font-style:normal;padding:.16em 0 .10em;margin:-.16em 0 -.10em}
.rgb{filter:drop-shadow(.42cqw 0 0 rgba(255,30,80,.8)) drop-shadow(-.42cqw 0 0 rgba(0,170,255,.8))}

/* ---------- S0 : COLD OPEN ---------- */
.hud{position:absolute;top:5cqw;left:6cqw;right:6cqw;display:flex;justify-content:space-between;
     font-size:2.5cqw;font-weight:700;letter-spacing:.42em;color:var(--ink);mix-blend-mode:normal}
.s0-wrap{position:absolute;left:0;right:0;top:39%;transform:translateY(-50%)}
.s0-h{font-family:'Anton',Impact,sans-serif;font-size:31cqw;line-height:.92;color:var(--ink);text-align:center}
.s0-b{font-family:'Anton',Impact,sans-serif;font-size:23.5cqw;line-height:.94;color:#B4682A;text-align:center;margin-top:1cqw}
.s0-sub{margin-top:4.4cqw;text-align:center;font-size:2.9cqw;font-weight:500;letter-spacing:.44em;color:var(--ink);opacity:.72}
.s0-badge{position:absolute;left:50%;bottom:15cqw;transform:translateX(-50%);white-space:nowrap;
  font-size:2.6cqw;font-weight:700;letter-spacing:.5em;color:var(--ink);opacity:.8}

/* ---------- S1 : PORTRAIT ---------- */
.s1-cap{position:absolute;left:0;right:0;bottom:13cqw;text-align:center}
.s1-cap .a{font-family:'Anton',Impact,sans-serif;font-size:11cqw;line-height:1;letter-spacing:.06em;color:var(--ink)}
.s1-cap .r{width:26cqw;height:.5cqw;background:var(--orange);margin:2.4cqw auto}
.s1-cap .b{font-size:2.7cqw;font-weight:500;letter-spacing:.44em;color:var(--ink);opacity:.66}
.s1-tl{position:absolute;left:6cqw;bottom:13cqw;font-size:2.4cqw;font-weight:700;letter-spacing:.4em;color:var(--ink);opacity:.5}
.s1-tr{position:absolute;right:6cqw;bottom:13cqw;font-size:2.4cqw;font-weight:700;letter-spacing:.4em;color:var(--ink);opacity:.5}

/* ---------- S2 : NAME ---------- */
.s2-bar{position:absolute;left:-14cqw;right:-14cqw;top:48.5%;height:44cqw;background:var(--ink);
        clip-path:inset(0 0 0 0)}
.s2-ruth{position:absolute;left:0;right:0;top:4.4cqw;
  font-family:'Anton',Impact,sans-serif;font-size:25cqw;line-height:1;color:var(--cream);text-align:center}
.s2-below{position:absolute;left:0;right:0;bottom:4.4cqw;text-align:center}
.s2-ja{font-size:3.2cqw;font-weight:700;letter-spacing:.42em;color:var(--orange)}
.s2-ja2{font-size:2.1cqw;font-weight:500;letter-spacing:.5em;color:rgba(243,236,224,.5);margin-top:1.2cqw}

/* ---------- S3 : WISHES ---------- */
.s3-scrim{position:absolute;inset:0;opacity:0;
  background:linear-gradient(180deg,rgba(var(--bgr),.12) 0%,rgba(var(--bgr),.74) 36%,rgba(var(--bgr),.95) 100%)}
.s3-words{position:absolute;inset:0;overflow:hidden}
.fw{position:absolute;font-family:'Anton',Impact,sans-serif;opacity:0;white-space:nowrap;line-height:1}
.s3-cards{position:absolute;left:0;right:0;top:47%;display:flex;flex-direction:column;gap:4.2cqw;padding:0 7cqw}
.wcard{background:var(--white);border-radius:1.6cqw;padding:3.4cqw 4.4cqw 3.6cqw;display:flex;align-items:flex-start;gap:3.4cqw;
  box-shadow:0 1.4cqw 4cqw rgba(40,25,12,.16);border-left:1.1cqw solid var(--orange);will-change:transform,opacity}
.wcard.alt{border-left-color:var(--green)}
.wcard.alt2{border-left-color:var(--lip)}
.wcard b{font-family:'Anton',Impact,sans-serif;font-size:6.4cqw;line-height:.9;color:var(--orange);opacity:.9}
.wcard.alt b{color:var(--green)} .wcard.alt2 b{color:var(--lip)}
.wcard span{font-size:4.1cqw;font-weight:700;line-height:1.18;letter-spacing:.02em;color:var(--ink)}

/* ---------- S4 : BACK TO SCULPT ---------- */
.s4-kick{position:absolute;left:0;right:0;top:15%;text-align:center;font-size:2.8cqw;font-weight:700;letter-spacing:.5em;color:var(--orange)}
.s4-h1{position:absolute;left:0;right:0;top:20%;text-align:center;font-family:'Anton',Impact,sans-serif;
  font-size:15cqw;line-height:.96;color:var(--cream)}
.s4-h2{position:absolute;left:0;right:0;top:30.5%;text-align:center;font-family:'Anton',Impact,sans-serif;
  font-size:19cqw;line-height:.96;color:var(--orange)}
.s4-sub{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:3cqw;font-weight:500;letter-spacing:.3em;color:var(--cream);opacity:.62}
.s4-reps{position:absolute;left:0;right:0;top:68%;display:flex;flex-direction:column;align-items:center}
.s4-ring{position:relative;width:20cqw;height:20cqw}
.s4-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.s4-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Anton',Impact,sans-serif;font-size:9cqw;color:var(--cream);line-height:1}
.s4-lab{margin-top:1.4cqw;font-size:2.4cqw;font-weight:700;letter-spacing:.46em;color:var(--orange)}
.s4-foot{position:absolute;left:0;right:0;bottom:8cqw;text-align:center;font-size:2.4cqw;font-weight:500;letter-spacing:.36em;color:var(--cream);opacity:.4}

/* ---------- S5 : MUSIC + FINALE ---------- */
/* voile léger, seulement dans le bas où vit le texte : le vinyle doit rester lisible */
.s5-scrim{position:absolute;inset:0;opacity:0;
  background:linear-gradient(180deg,rgba(var(--bgr),0) 0%,rgba(var(--bgr),0) 44%,
             rgba(var(--bgr),.40) 70%,rgba(var(--bgr),.70) 100%)}
.s5-m{position:absolute;left:0;right:0;top:57%;text-align:center}
.s5-m1{font-size:4.4cqw;font-weight:700;letter-spacing:.3em;color:var(--ink);opacity:.72}
.s5-m2{font-family:'Anton',Impact,sans-serif;font-size:20cqw;line-height:1;margin-top:1.4cqw;
  color:var(--ink);letter-spacing:.02em}
.s5-eq{position:absolute;left:5cqw;right:5cqw;bottom:20cqw;height:24cqw;display:flex;align-items:flex-end;gap:.75cqw;opacity:0}
.s5-eq i{flex:1;background:linear-gradient(180deg,var(--orange),var(--green));border-radius:.4cqw .4cqw 0 0;height:6%}
.s5-eq i:nth-child(3n){background:linear-gradient(180deg,var(--ink),#4a3b2f)}
#fin{position:absolute;inset:0;background:var(--ink);clip-path:inset(100% 0 0 0);display:flex;
     flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8cqw}
.fin-star{font-size:3cqw;font-weight:700;letter-spacing:.6em;color:var(--orange);margin-bottom:5cqw}
.fin-1{font-family:'Anton',Impact,sans-serif;font-size:7cqw;line-height:1;letter-spacing:.09em;color:var(--cream)}
.fin-2{font-family:'Anton',Impact,sans-serif;font-size:31cqw;line-height:1;color:var(--orange);margin-top:2.4cqw}
.fin-3{margin-top:5cqw;font-size:3cqw;font-weight:500;letter-spacing:.36em;color:var(--cream);opacity:.7}
.fin-heart{margin-top:6cqw;font-size:6cqw;color:var(--lip)}

/* ---------- FX LAYERS ---------- */
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#wipe{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wb{position:absolute;top:-32%;height:164%;left:-92%;will-change:transform;transform:translateX(0%) skewX(-13deg);opacity:0}
.wb.a{width:80%;background:var(--ink)}
.wb.b{width:54%;background:var(--orange)}
.wb.c{width:36%;background:var(--cream)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 78% at 50% 46%,rgba(0,0,0,0) 42%,rgba(0,0,0,.34) 100%)}
#grain{position:absolute;inset:-8%;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
  animation:grain .55s steps(1) infinite}
@keyframes grain{
  0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}
  60%{transform:translate(-2%,-2%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}
}
#prog{position:absolute;left:0;right:0;bottom:0;height:.7cqw;background:rgba(20,17,16,.16)}
#prog i{display:block;height:100%;background:var(--orange);transform-origin:left center;transform:scaleX(0)}
#tc{position:absolute;right:6cqw;bottom:3.4cqw;font-size:2.2cqw;font-weight:700;letter-spacing:.22em;
  color:var(--ink);opacity:.45;font-variant-numeric:tabular-nums}

/* ---------- GATE ---------- */
#gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;
  background:radial-gradient(90% 70% at 50% 40%,#241D18,#0B0908);transition:opacity .5s ease}
#gate.gone{opacity:0;pointer-events:none}
.gate-in{text-align:center;padding:0 10cqw}
.gate-k{font-size:2.6cqw;font-weight:700;letter-spacing:.6em;color:var(--orange);opacity:.9}
.gate-t{font-family:'Anton',Impact,sans-serif;font-size:26cqw;line-height:1;color:var(--cream);margin:4cqw 0 1.4cqw}
.gate-s{font-size:3cqw;font-weight:500;letter-spacing:.34em;color:#8d8177;margin-bottom:11cqw}
#play{font-family:'Space Grotesk',sans-serif;font-size:3.4cqw;font-weight:700;letter-spacing:.22em;
  color:var(--ink);background:var(--orange);border:0;border-radius:999px;padding:3.6cqw 8cqw;cursor:pointer;
  box-shadow:0 0 0 0 rgba(217,152,90,.5);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,152,90,.45)}70%{box-shadow:0 0 0 3cqw rgba(217,152,90,0)}100%{box-shadow:0 0 0 0 rgba(217,152,90,0)}}
#replay{position:absolute;left:50%;bottom:11cqw;transform:translateX(-50%);z-index:21;display:none;
  font-family:'Space Grotesk',sans-serif;font-size:3cqw;font-weight:700;letter-spacing:.2em;color:var(--ink);
  background:var(--cream);border:0;border-radius:999px;padding:3.2cqw 7cqw;cursor:pointer}
#replay.on{display:block}
@media (prefers-reduced-motion:reduce){#grain,#play{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <svg id="art" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>

    <div id="type">
      <!-- ============ S0 ============ -->
      <section class="sc" id="s0">
        <div class="hud"><span>SHOWREEL</span><span>✦</span><span>MOTION</span></div>
        <div class="s0-wrap">
          <div class="ln s0-h" id="l-happy"></div>
          <div class="ln s0-b" id="l-bday"></div>
          <div class="ln s0-sub" id="l-sub"></div>
        </div>
        <div class="s0-badge" id="b0">✦ 2 0 2 6 ✦</div>
      </section>

      <!-- ============ S1 ============ -->
      <section class="sc" id="s1">
        <div class="s1-tl">01 — 06</div>
        <div class="s1-tr">RUTH</div>
        <div class="s1-cap">
          <div class="ln a" id="l-cap1"></div>
          <div class="r" id="capRule"></div>
          <div class="ln b" id="l-cap2"></div>
        </div>
      </section>

      <!-- ============ S2 ============ -->
      <section class="sc" id="s2">
        <div class="s2-bar" id="s2bar">
          <div class="ln s2-ruth" id="l-ruth"></div>
          <div class="s2-below">
            <div class="ln s2-ja" id="l-ja"></div>
            <div class="ln s2-ja2" id="l-ja2"></div>
          </div>
        </div>
      </section>

      <!-- ============ S3 ============ -->
      <section class="sc" id="s3">
        <div class="s3-scrim" id="s3scrim"></div>
        <div class="s3-words" id="s3words"></div>
        <div class="s3-cards" id="s3cards">
          <div class="wcard"><b>01</b><span>TOUT LE BONHEUR<br>DU MONDE</span></div>
          <div class="wcard alt"><b>02</b><span>UN DOS À MUSCLER<br>VRAIMENT INCROYABLE</span></div>
          <div class="wcard alt2"><b>03</b><span>DES ÉCOUTES DE MUSIQUE<br>À SAVOURER À FOND</span></div>
        </div>
      </section>

      <!-- ============ S4 ============ -->
      <section class="sc" id="s4">
        <div class="ln s4-kick" id="l-kick"></div>
        <div class="ln s4-h1" id="l-h1"></div>
        <div class="ln s4-h2" id="l-h2"></div>
        <div class="ln s4-sub" id="l-hsub"></div>
        <div class="s4-reps">
          <div class="s4-ring">
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(243,236,224,.16)" stroke-width="6"/>
            <circle id="repRing" cx="50" cy="50" r="44" fill="none" stroke="#D9985A" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg>
            <div class="s4-num" id="repNum">08</div>
          </div>
          <div class="s4-lab">REPS</div>
        </div>
        <div class="ln s4-foot" id="l-foot"></div>
      </section>

      <!-- ============ S5 ============ -->
      <section class="sc" id="s5">
        <div class="s5-scrim" id="s5scrim"></div>
        <div class="s5-eq" id="eq"></div>
        <div class="s5-m">
          <div class="ln s5-m1" id="l-m1"></div>
          <div class="ln s5-m2" id="l-m2"></div>
        </div>
      </section>

      <div id="fin">
        <div class="fin-star">✦ 2 0 2 6 ✦</div>
        <div class="ln fin-1" id="l-f1"></div>
        <div class="ln fin-2" id="l-f2"></div>
        <div class="fin-3">profite de chaque seconde</div>
        <div class="fin-heart">♥</div>
      </div>
    </div>

    <canvas id="fx"></canvas>
    <div id="wipe"><i class="wb a" id="wba"></i><i class="wb b" id="wbb"></i><i class="wb c" id="wbc"></i></div>
    <div id="flash"></div>
    <div id="vig"></div>
    <div id="grain"></div>
    <div id="prog"><i id="progFill"></i></div>
    <div id="tc">00:00 / 00:15</div>

    <div id="gate">
      <div class="gate-in">
        <div class="gate-k">SHOWREEL · 15 SECONDES</div>
        <div class="gate-t">RUTH</div>
        <div class="gate-s">MOTION DESIGN · ♪ ZMEYEV — EVERY NIGHT</div>
        <button id="play">▶  TOUCHER POUR LANCER</button>
      </div>
    </div>
    <button id="replay">↺  REVOIR</button>
  </div>

/* ---------------- FEUILLE DE MONSTERA ---------------- */
/* profil normalisé : [lobe, encoche] par paire, en remontant vers la pointe.
   x = fraction de demi-largeur, y = fraction de longueur (0 = base, -1 = pointe).
   Les lobes sont tracés en quadratiques bombées vers l'extérieur, les encoches en
   retraits secs : c'est ce couple arrondi/tressé qui donne la silhouette du monstera. */
const MONSTERA=[[0.60,-0.15],[0.15,-0.22],
                [0.93,-0.39],[0.18,-0.46],
                [0.91,-0.60],[0.16,-0.67],
                [0.72,-0.79],[0.13,-0.84]];
const LEAF_BASE=[0.09,0.00], LEAF_TIP=[0.05,-0.97];
function addLeaf(parent,bx,by,len,wid,ang,fill,vein,seed){
  const out=E('g',{transform:`translate(${bx} ${by}) rotate(${ang})`},parent);
  const inn=E('g',{},out); leafIns.push({el:inn});
  const bend=Math.sin(seed*1.7)*len*0.08;          // courbure douce de la tige
  const R=(x,y)=>[(bend*(1+y)+x*wid).toFixed(1),(y*len).toFixed(1)];
  const L=(x,y)=>[(bend*(1+y)-x*wid).toFixed(1),(y*len).toFixed(1)];
  const M=LEAF_BASE, T=LEAF_TIP, P=MONSTERA;

  let d=`M ${R(M[0],M[1]).join(' ')}`;
  for(let i=0;i<P.length;i+=2)                      // bord droit : lobe bombé -> encoche
    d+=` Q ${R(P[i][0],P[i][1]).join(' ')} ${R(P[i+1][0],P[i+1][1]).join(' ')}`;
  d+=` Q ${R(0.34,-0.93).join(' ')} ${R(T[0],T[1]).join(' ')}`;   // pointe
  for(let i=P.length-2;i>=0;i-=2)                  // bord gauche : miroir, en redescendant
    d+=` Q ${L(P[i][0],P[i][1]).join(' ')} ${L(P[i+1][0],P[i+1][1]).join(' ')}`;
  d+=` Q ${L(0.34,-0.06).join(' ')} ${L(M[0],M[1]).join(' ')} Z`;

  E('path',{d,fill:fill,stroke:fill,'stroke-width':2.5,'stroke-linejoin':'round'},inn);
  // nervure principale
  E('path',{d:`M 0 0 Q ${(bend*0.6).toFixed(1)} ${(-len*0.5).toFixed(1)} ${bend.toFixed(1)} ${(-len*0.96).toFixed(1)}`,
    fill:'none',stroke:vein,'stroke-width':4.5,'stroke-linecap':'round',opacity:.45},inn);
  // nervures secondaires vers chaque lobe
  for(let i=0;i<P.length;i+=2){
    const y=P[i][1]*len, X=bend*(1+y);
    E('path',{d:`M ${X.toFixed(1)} ${y.toFixed(1)} L ${(X+wid*0.80).toFixed(1)} ${(y-len*0.05).toFixed(1)}`,
      fill:'none',stroke:vein,'stroke-width':2.4,opacity:.26,'stroke-linecap':'round'},inn);
    E('path',{d:`M ${X.toFixed(1)} ${y.toFixed(1)} L ${(X-wid*0.80).toFixed(1)} ${(y-len*0.05).toFixed(1)}`,
      fill:'none',stroke:vein,'stroke-width':2.4,opacity:.26,'stroke-linecap':'round'},inn);
  }
  return inn;
}
function curlChain(parent,pts,baseR,fill){
  const g=E('g',{},parent);
  // Catmull-Rom sampling
  const P=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let s=0;s<14;s++){
      const t=s/14,t2=t*t,t3=t2*t;
      P.push([
        .5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        .5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      ]);
    }
  }
  P.push(pts[pts.length-1]);
  P.forEach((p,i)=>{
    const r=baseR*(0.72+0.5*Math.abs(Math.sin(i*0.55)))*(1+0.16*Math.sin(i*0.23));
    E('circle',{cx:p[0].toFixed(1),cy:p[1].toFixed(1),r:r.toFixed(1),fill:fill},g);
  });
  return g;
}

    fctx.globalAlpha=d.a*(1-dark*0.72)*(0.75+0.25*Math.sin(_dustT*d.sp*3+d.ph));
    fctx.fillStyle='#FFF6E6';
    fctx.beginPath(); fctx.arc(x,y,d.s,0,6.2832); fctx.fill();
  }
  fctx.globalAlpha=1;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    const dm=Math.pow(0.988,dt*60); p.vy+=p.g*dt; p.vx*=dm; p.vy*=dm;
    p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.rot+=p.vr*dt*60*0.35;
    p.life-=p.dec*dt;
    if(p.life<=0||p.y>2100){parts.splice(i,1);continue;}
    fctx.save();
    fctx.translate(p.x,p.y); fctx.rotate(p.rot);
    fctx.globalAlpha=clamp(p.life,0,1);
    if(p.glow){fctx.shadowColor=p.c;fctx.shadowBlur=18;fctx.fillStyle=p.c;
      fctx.beginPath();fctx.arc(0,0,p.w*(0.4+p.life),0,6.2832);fctx.fill();}
    else{fctx.fillStyle=p.c;fctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
    fctx.restore();
  }
  fctx.restore();
}

/* Couleur dominante de l'image = son aplat de fond, pour une couture invisible.
   On échantillonne une grille et on retient la teinte la plus fréquente : plus
   fiable que le coin en haut à gauche, qui peut tomber sur un bandeau blanc. */
function sampleBg(img){
  try{
    const N=24;
    const c=document.createElement('canvas'); c.width=c.height=N;
    const x=c.getContext('2d',{willReadFrequently:true});
    x.drawImage(img,0,0,N,N);
    const d=x.getImageData(0,0,N,N).data;
    const bins=new Map();
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]<128) continue;                       // ignorer les pixels transparents
      const k=(d[i]>>3)+','+(d[i+1]>>3)+','+(d[i+2]>>3);
      const b=bins.get(k)||{n:0,r:0,g:0,b:0};
      b.n++; b.r+=d[i]; b.g+=d[i+1]; b.b+=d[i+2];
      bins.set(k,b);
    }
    let best=null;
    for(const b of bins.values()) if(!best||b.n>best.n) best=b;
    return best?[Math.round(best.r/best.n),Math.round(best.g/best.n),Math.round(best.b/best.n)]:null;
  }catch(e){ return null; }
}

/* caméra : cadrage par scène + poussée lente continue ; chaque scène repart exactement d'où la précédente s'arrête */
const PUSH=0.035, cpush=(c,q)=>[c[0]-400*c[1]*PUSH*q, c[1]*(1+PUSH*q)];
function camera(t){
  const T=[[352,1.145],[300,1.0],[268,1.09],[250,1.14],[206,1.32]];
  const R=[[2.26,3.15],[4.60,5.40],[7.10,8.20],[9.90,10.50],[12.20,12.70]];
  const Q=[[3.15,4.40],[5.40,7.10],[8.20,9.90],[10.50,12.20],null];
  const k=t<4.40?0:t<7.10?1:t<9.90?2:t<12.20?3:4;
  const a=k?cpush(T[k-1],1):[486,1.245], b=T[k], p=eOut(PR(t,R[k][0],R[k][1]));
  let c=[lerp(a[0],b[0],p),lerp(a[1],b[1],p)];
  if(Q[k]) c=cpush(c,eIO(PR(t,Q[k][0],Q[k][1])));
  return c;
}

  // opacité selon la scène
  const vis=(1-eIO(PR(t,9.80,9.98))*(1-PR(t,12.16,12.36)))*(1-eIO(PR(t,14.0,14.22)));

  if(t<9.78) return C;
  if(t<9.92) return mix(C,CG.ink,PR(t,9.78,9.92));
  if(t<12.18) return CG.ink;
  if(t<12.34) return mix(CG.ink,C,PR(t,12.18,12.34));
  return C;
}
function wiper(t){
  let act=false;
  for(let i=0;i<WIPES.length;i++){
    const t0=WIPES[i];
    if(t<t0-0.05||t>t0+0.45)continue;
    act=true;
    const bars=[els.wba,els.wbb,els.wbc];
    bars.forEach((b,j)=>{
      const p=PR(t,t0+j*0.038,t0+0.30+j*0.038);
      b.style.transform=`translateX(${(p*264).toFixed(2)}%) skewX(-13deg)`;
      b.style.opacity=(p>0&&p<1)?1:0;
    });
  }
  if(!act) [els.wba,els.wbb,els.wbc].forEach(b=>{b.style.opacity=0;});
}
const FIRED={};
function once(k,c,f){if(c&&!FIRED[k]){FIRED[k]=1;f();}}
let confettiFired=false;
function render(t){
  tick();
  RT=clamp(t,0,TOTAL+DX+1); t=warp(RT);
  const dark = t>9.78&&t<12.26;
  A.bg.setAttribute('fill',rgb(bgAt(t)));

  portrait(t);
  sc0(t);sc1(t);sc2(t);sc3(t);sc4(t);sc5(t);
  wiper(t);

  // flash (impulsions courtes)
  const pulse=(a,b,c,v)=>PR(t,a,b)*(1-eIO(PR(t,b,c)))*v;
  const fl=Math.max(
    pulse(9.78,9.96,10.18,1),
    pulse(12.18,12.32,12.52,1),
    pulse(DROP-0.010,DROP+0.05,DROP+0.58,0.92)
  );
  els.flash.style.opacity=clamp(fl*(REDUCED?.35:1)).toFixed(3);
  els.flash.style.display=(fl>0.004?'':'none');

  // aberration chromatique aux transitions
  let near=false;
  for(const w of WIPES) if(Math.abs(t-(w+0.13))<0.14) near=true;
  if(Math.abs(t-DROP)<0.16) near=true;
  if(near!==typeEl.classList.contains('rgb')) typeEl.classList.toggle('rgb',near);

  // HUD
  els.progFill.style.transform=`scaleX(${(RT/(TOTAL+DX)).toFixed(4)})`;
  els.tc.textContent='00:'+String(Math.min(99,Math.floor(RT))).padStart(2,'0')+' / 00:'+String(Math.round(TOTAL+DX)).padStart(2,'0');
  els.tc.style.color=dark?'rgba(243,236,224,.5)':'rgba(20,17,16,.45)';

  // étincelles ambiantes pendant la scène vinyle
  if(t>12.30&&t<DROP){_spAcc+=_dt*18;while(_spAcc>=1){_spAcc--;sparks(rr(0,1080),rr(200,900),1);}}

  // confettis
  if(!confettiFired&&t>DROP+0.02){confettiFired=true;burst(540,640,110,27,15);}
  if(confettiFired&&parts.length<50&&t>DROP+0.12&&t<DROP+1.6) burst(540,700,10,22,15);

  stepParticles(0,dark?1:0);
  updateEq(t);
  punch(t);
}

/* ---------------- IMPACT : léger coup de caméra sur les coupes fortes ---------------- */
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let _pk='';
function punch(t){
  let k=0;
  if(!REDUCED) for(const [t0,a] of [[2.10,.55],[4.40,.7],[snapK(7.10),.75],[snapK(9.90),.95],[snapK(12.20),.85],[DROP,1.7]]){
    const d=t-t0; if(d>0&&d<.6) k=Math.max(k,a*Math.exp(-d*8));
  }
  const tr=k<.004?'':`translate3d(${(Math.sin(t*97)*k*.9).toFixed(2)}cqw,${(Math.cos(t*81)*k*.9).toFixed(2)}cqw,0) scale(${(1+k*.03).toFixed(4)})`;
  if(tr===''&&_pk==='')return; _pk=tr;
  art.style.transform=tr; typeEl.style.transform=tr; fxc.style.transform=tr;
}

/* ---------------- EQ ---------------- */
let eqPh=0;
function updateEq(t){
  const n=CH.eq.length; if(!n)return;
  const vis=t>12.4&&t<14.1; if(!vis)return;
  let data=null;
  if(analyser){analyser.getByteFrequencyData(fd);data=fd;}
  eqPh+=0.34;
  for(let i=0;i<n;i++){
    let v;
    if(data){
      const a=Math.floor(Math.pow(i/n,1.7)*(fd.length*0.5));
      const b=Math.max(a+1,Math.floor(Math.pow((i+1)/n,1.7)*(fd.length*0.5)));
      let m=0;for(let k=a;k<b;k++)m=Math.max(m,data[k]);
      v=m/255;
    }else v=0.4+0.35*Math.abs(Math.sin(i*0.5+eqPh));
    const h=5+v*95;
    CH.eq[i].style.height=h.toFixed(1)+'%';
  }
}

const CHORDS={

function g0(v){const x=AC.createGain();x.gain.value=v;return x;}

function hat(t,dur,v){v=v==null?.14:v;const s=Math.max(0.002,t+OFF);

function bass(t,dur,f,v){v=v==null?.34:v;const s=Math.max(0.002,t+OFF);

function pluck(t,dur,f,v){v=v==null?.15:v;const s=Math.max(0.002,t+OFF);

function pad(t,dur,fs,v,cut){v=v==null?.07:v;const s=Math.max(0.002,t+OFF);

  lp.frequency.linearRampToValueAtTime(c,s+dur);
  const og=g0(0);og.gain.setValueAtTime(0,s);og.gain.linearRampToValueAtTime(v,s+dur*.3);
  og.gain.setValueAtTime(v*.85,s+dur*.68);og.gain.linearRampToValueAtTime(0,s+dur);

  o.frequency.setValueAtTime(180,s);o.frequency.exponentialRampToValueAtTime(1500,s+dur);

function schedule(){

  PROG.forEach(([bt,cn],i)=>{

    if(i>=4) pad(bt-0.06,2.3,c.notes.map(n=>mtof(n-12)),.075,1000);
  });
  // KICK (log-drum)
  for(let bt=1;bt<14;bt+=BAR){
    const v=bt<4?.85:(bt<8?1:(bt<10?.9:1));
    [0,.75,1.25,1.75].forEach((o,i)=>kick(bt+o,v*(i===3?.55:1)*(bt>=10&&bt<12?1.12:1)));
    if(bt>=12)[.375,.875,1.375].forEach(o=>kick(bt+o,.5));
  }
  // CLAP
  for(let bt=4;bt<14;bt+=BAR){
    const v=bt<8?.42:(bt<10?.58:.72);
    clap(bt+.5,v);clap(bt+1.5,v);
    if(bt>=8)clap(bt+1.25,v*.4);

  for(let bt=6.5;bt<14;bt+=BAR)
    for(let i=0;i<8;i++)hat(bt+i*.25,i%2?.11:.035,i%2?.15:.09);

    for(let i=0;i<16;i++)if(i%2===1||i%4===0)shaker(bt+i*.125,i%4===1?.1:.055);

  for(let bt=2;bt<14;bt+=BAR){
    const c=chordAt(bt),v=bt<8?.32:(bt<10?.24:.38);
    [[0,0,.42],[.5,0,.2],[.75,7,.3],[1,0,.22],[1.5,12,.4]]
      .forEach(([o,iv,d])=>bass(bt+o,d,mtof(c.root+iv),v));
  }
  // PLUCK
  for(let bt=4;bt<14;bt+=BAR){
    const c=chordAt(bt);
    const seq=[0,1,2,3,2,1,2,3,0,1,2,3,2,3,1,2];
    for(let i=0;i<16;i++){
      if(bt===4&&i<3)continue;

      const v=bt<8?.125:(bt<10?.155:.185);
      pluck(bt+i*.125,.26,mtof(c.notes[seq[i]]+12),v);

    .forEach(([t,n,d])=>lead(t,d,mtof(n),.14));

  pluck(DROP,.85,mtof(81),.2);pluck(DROP+.1,.7,mtof(76),.16);

}

/* ==========================================================================
   5b. MORCEAU (extrait embarqué : 22,3 s → 37,6 s de « Every Night »)
   ========================================================================== */
const KICKS=[0.035, 0.793, 1.157, 1.432, 1.843, 2.188, 2.826, 3.576, 3.942, 4.166, 4.614, 4.979, 5.626, 6.738, 7.014, 7.419, 7.77, 8.407, 9.157, 9.493, 9.804, 10.215, 10.56, 11.198, 12.288, 13.351, 13.999, 14.738, 15.093, 15.342, 15.796, 16.142];   // temps des coups graves, en secondes de l'animation
let SONG=null, songReady=false, songSrc=null, KR=[];
(function(){
  const pb=$('#play'), lab=pb.textContent; pb.textContent='CHARGEMENT…';
  const done=()=>{ if(!SONG)DX=0; songReady=true; pb.textContent=lab; $('.gate-k').textContent='SHOWREEL · '+Math.round(TOTAL+DX)+' SECONDES'; };
  const ok=buf=>{ if(!SONG){SONG={buf,off:0.82}; KR=KICKS.filter(k=>k<8.39).concat(KICKS.filter(k=>k>=8.39-DX).map(k=>k+DX));} done(); };
  try{
    const bin=atob($('#song-data').textContent.trim()), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const c=new OAC(2,44100,44100);
    const pr=c.decodeAudioData(u.buffer,ok,done);
    if(pr&&pr.then)pr.then(ok).catch(done);
  }catch(e){ console.warn('Décodage impossible',e); done(); }
})();
function playSong(){
  if(songSrc){songSrc.forEach(x=>{try{x.stop();}catch(e){}});}
  const s=OFF, B=SONG.buf, X=8.39, D=DX;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=.7;       // ouverture du filtre : le morceau « se révèle » avec l'iris
  lp.frequency.setValueAtTime(380,s); lp.frequency.exponentialRampToValueAtTime(16000,s+1.7);
  const g=AC.createGain();
  g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.92,s+.45);
  g.gain.setValueAtTime(.92,s+14.7+D); g.gain.linearRampToValueAtTime(0,s+15.7+D);
  lp.connect(g); g.connect(AC.destination); g.connect(analyser);
  // 1re partie : le morceau jusqu'au temps X (sur un kick de début de mesure)
  const a=AC.createBufferSource(); a.buffer=B; const ga=AC.createGain(); a.connect(ga); ga.connect(lp);
  ga.gain.setValueAtTime(1,s+X-.03); ga.gain.linearRampToValueAtTime(0,s+X+.01);
  a.start(s,SONG.off,X+.05);
  // 2e partie : on repart une mesure en arrière (D secondes), puis le morceau continue normalement jusqu'au drop
  const b=AC.createBufferSource(); b.buffer=B; const gb=AC.createGain(); b.connect(gb); gb.connect(lp);
  gb.gain.setValueAtTime(0,s+X-.03); gb.gain.linearRampToValueAtTime(1,s+X+.01);
  b.start(s+X-.03,SONG.off+X-.03-D,15.7+D-(X-.03));
  songSrc=[a,b];
}
/* secondes écoulées depuis le dernier kick (grille de secours si le morceau n'est pas chargé) */
function kickAge(){
  if(!SONG) return ((RT-10)%0.5+0.5)%0.5;
  let a=99; for(let i=0;i<KR.length;i++){ if(KR[i]<=RT)a=RT-KR[i]; else break; } return a;
}
const beatPulse=()=>Math.exp(-kickAge()*9);
const snapK=t0=>{ if(!SONG)return t0; for(const k of KICKS) if(Math.abs(k-t0)<.12) return k; return t0; };

/* ==========================================================================
   6. BOOT / PLAY
   ========================================================================== */
function resize(){
  const r=stage.getBoundingClientRect();
  const dpr=Math.min(2,window.devicePixelRatio||1);
  fxc.width=Math.max(1,Math.round(r.width*dpr));
  fxc.height=Math.max(1,Math.round(r.height*dpr));
  fxc.style.width=r.width+'px';fxc.style.height=r.height+'px';
}
buildArt();
buildType();
initParticles();
resize();
window.addEventListener('resize',resize);

// grain
(function(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d'),id=x.createImageData(128,128);
  for(let i=0;i<id.data.length;i+=4){const v=(Math.random()*255)|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=30;}
  x.putImageData(id,0,0);
  $('#grain').style.backgroundImage='url('+c.toDataURL()+')';
})();

let playing=false, rafId=null, idleId=null, clockStart=0;
function nowT(){
  if(AC) return AC.currentTime-OFF;
  return (performance.now()/1000)-clockStart;
}
function loop(){
  const t=nowT();
  render(t);
  if(t>TOTAL+DX){ finish(); return; }
  rafId=requestAnimationFrame(loop);
}
/* post-scriptum : le confetti continue de tomber sur l'image finale */
function idle(){
  tick();
  const ts=performance.now()/1000, t=TOTAL+0.6+ts%100, b=(ts*1.1)%1;
  const hb=Math.exp(-Math.pow((b-.05)/.05,2))+.7*Math.exp(-Math.pow((b-.24)/.05,2));
  ELS.fh.style.transform=`scale(${(1+.24*hb).toFixed(3)})`;
  els.fin.style.transform=`translate3d(0,${(Math.sin(t*2.1)*1.4).toFixed(2)}cqw,0)`;
  if(!REDUCED&&parts.length<24&&rnd()<_dt*4) parts.push({x:rr(0,1080),y:-40,vx:rr(-1.2,1.2),vy:rr(1,2.5),g:3,
    w:rr(7,16),h:rr(11,24),rot:rr(0,6.28),vr:rr(-9,9),c:PCOL[(rnd()*PCOL.length)|0],life:1,dec:rr(.07,.11)});
  stepParticles(0,1);
  idleId=requestAnimationFrame(idle);
}
function finish(){
  playing=false;
  if(rafId)cancelAnimationFrame(rafId); rafId=null;
  if(idleId)cancelAnimationFrame(idleId); idleId=null;
  render(TOTAL+DX+0.55);
  $('#gate').classList.add('gone');
  $('#replay').classList.add('on');
  idle();
}
function start(){
  if(playing||!songReady)return;
  playing=true;
  parts.length=0; confettiFired=false; _lipPop=false; for(const k in FIRED)delete FIRED[k];
  if(idleId){cancelAnimationFrame(idleId);idleId=null;}
  $('#gate').classList.add('gone');
  $('#replay').classList.remove('on');
  _seed=20260930;
  try{
    if(!AC){ initAudio(); }
    else if(AC.state==='suspended'){ AC.resume(); }
    if(AC.state!=='running'){ AC=null; clockStart=performance.now()/1000; }
    else {
      OFF=AC.currentTime+0.22;
      master.gain.cancelScheduledValues(AC.currentTime);
      master.gain.setValueAtTime(0.0,AC.currentTime);
      master.gain.linearRampToValueAtTime(.95,AC.currentTime+0.35);
      if(SONG) playSong(); else schedule();
    }
  }catch(e){
    console.warn('Audio indisponible',e);
    AC=null;clockStart=performance.now()/1000;
  }
  loop();
}
$('#play').addEventListener('click',e=>{e.stopPropagation();start();});
$('#replay').addEventListener('click',e=>{e.stopPropagation();start();});
$('#stage').addEventListener('click',()=>{ if(!playing) start(); });

/* état initial — (?t=3.6 permet de relire une frame précise) */
(function(){
  const m=/[?&]t=(-?[\d.]+)/.exec(location.search);
  const seek=m?parseFloat(m[1]):NaN;
  const boot=()=>{ render(isNaN(seek)?0:seek); };
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(boot).catch(boot);}
  else boot();
  initPhoto().then(ok=>{ if(ok) render(isNaN(seek)?0:seek); });
})();
</script>
